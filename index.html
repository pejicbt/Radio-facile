/* ============================================================
   MODULE AVP
   ============================================================ */
const AVP = (function () {
  let state, step, ivId;

  function reset(interventionId) {
    ivId = interventionId;
    state = {
      contexte: null,
      vehicules: [
        { id: "tourisme", label: "Véhicule de tourisme", count: 0, genre: "m" },
        { id: "pl", label: "Poids lourd", count: 0, genre: "m" },
        { id: "bus", label: "Bus", count: 0, genre: "m" },
        { id: "deuxroues", label: "Deux-roues", count: 0, genre: "m" },
        { id: "utilitaire", label: "Utilitaire", count: 0, genre: "m" },
        { id: "pieton", label: "Piéton", count: 0, genre: "m" }
      ],
      victimes: [ { gravite: null, sexe: null, statut: "aucun", service: null } ],
      demande: null,
      moyens: moyensTemplateAVP(),
      adresse: "", commune: "", paris: false,
      voieCategorie: null, periphSens: null, autorouteNom: null, autorouteSens: null, pk: "",
      circulation: null, voiesInterrompues: "", voiesTotal: "", perimetre: false,
      eqType: null, hopital: "", eqChoix: null,
      saved: false, editing: false, editedMessage: null
    };
    step = 0;
  }
  reset(null);

  function totalUA() { return state.victimes.filter(v => v.gravite === "ua" || v.gravite === "acr").length; }
  function vehiculesText() {
    const used = state.vehicules.filter(v => v.count > 0);
    if (used.length === 0) return "[véhicules]";
    const totalActors = used.reduce((s,v) => s + v.count, 0);
    let txt = used.map(v => v.count + " " + v.label.toLowerCase() + (v.count > 1 ? "s" : "")).join(" et ");
    if (totalActors === 1) txt += used[0].genre === "f" ? " seule" : " seul";
    return txt;
  }
  function bilanText() { return denombrementText(state.victimes, "provisoire"); }
  function generateMessage() {
    const moyensLabels = state.moyens.filter(m => m.checked).sort((a,b) => a.priorite - b.priorite).map(m => moyenLabelWithQty(m));
    let demandePart = "";
    if (state.demande === true && moyensLabels.length > 0) demandePart = "Je demande " + moyensLabels.join(" et ") + ", ";
    let lieuPart;
    if (state.contexte === "voierapide") {
      let voieLabel;
      if (state.voieCategorie === "periph") {
        voieLabel = state.periphSens === "interieur" ? "périphérique intérieur" : state.periphSens === "exterieur" ? "périphérique extérieur" : "[périphérique]";
      } else if (state.voieCategorie === "autoroute") {
        voieLabel = (state.autorouteNom || "[autoroute]") + (state.autorouteSens ? ", " + state.autorouteSens : "");
      } else {
        voieLabel = "[voie]";
      }
      lieuPart = voieLabel + (state.pk ? ", point kilométrique " + state.pk : "");
    } else {
      lieuPart = (state.adresse || "[adresse]") + (!state.paris && state.commune ? " à " + state.commune : "");
    }
    const motifPrefix = "accident de la circulation impliquant " + vehiculesText();
    let mesuresPart = "";
    if (state.circulation === "reduite" && state.voiesInterrompues && state.voiesTotal) {
      mesuresPart = state.voiesInterrompues + " voie" + (parseInt(state.voiesInterrompues) > 1 ? "s" : "") + " interrompue" + (parseInt(state.voiesInterrompues) > 1 ? "s" : "") + " sur " + state.voiesTotal;
    } else if (state.circulation === "interrompue") mesuresPart = "circulation totalement interrompue";
    let eqPart = "";
    if (totalUA() > 0 && state.eqType === "civ") {
      eqPart = state.eqChoix === "presente" ? "équipe médicale " + (state.hopital || "[hôpital]") + " présente avant notre arrivée" : state.eqChoix === "attente" ? "attendons équipe médicale" : "";
    } else if (totalUA() > 0 && state.eqType === "ar" && state.eqChoix === "attente") {
      eqPart = "attendons équipe médicale";
    }
    const tail = [ state.perimetre ? "périmètre de sécurité et reconnaissances en cours" : "reconnaissances en cours" ];
    const segments = [
      demandePart + lieuPart + ", " + motifPrefix + ".",
      bilanText() + ".",
      mesuresPart ? mesuresPart + "." : "",
      eqPart ? eqPart + "." : "",
      coordinationSuffix(state.moyens).trim(),
      tail.join(", ") + "."
    ].filter(s => s !== "");
    return segments.join(" ");
  }
  function currentMessage() { return state.editedMessage !== null ? state.editedMessage : generateMessage(); }

  function totalSteps() { return 7; }

  function navButtons(container, canNext) {
    const nav = el("div", { class: "nav-buttons" });
    if (step < totalSteps()) {
      const next = el("button", { class: "btn-primary", text: step === totalSteps() - 1 ? "Générer le message" : "Suivant" });
      next.disabled = !canNext;
      next.addEventListener("click", () => { if (!canNext) return; step++; if (step === 6 && totalUA() === 0) step++; render(document.getElementById("app-root")); });
      nav.appendChild(next);
    }
    container.appendChild(nav);
  }

  function renderVictimeBlock(container, index) {
    const v = state.victimes[index];
    const wrap = el("div", { class: "victime-block" });
    const hdr = el("div", { class: "victime-header" }, [ el("span", { text: "Victime " + (index + 1) }) ]);
    if (index > 0) {
      hdr.appendChild(el("button", { class: "remove-link", text: "Retirer", onclick: () => { state.victimes.splice(index, 1); state.editedMessage = null; render(document.getElementById("app-root")); } }));
    }
    wrap.appendChild(hdr);
    wrap.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Sexe" }));
    const sexeGrid = el("div", { class: "row", style: "margin-bottom:12px" });
    ["homme","femme"].forEach(s => {
      const b = el("button", { class: "card card-half" + (v.sexe === s ? " active" : ""), text: s[0].toUpperCase() + s.slice(1) });
      b.addEventListener("click", () => { v.sexe = s; state.editedMessage = null; render(document.getElementById("app-root")); });
      sexeGrid.appendChild(b);
    });
    wrap.appendChild(sexeGrid);
    wrap.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Statut particulier" }));
    const statuts = [
      {id:"aucun",label:"Aucun"},{id:"enfant",label:"Enfant"},{id:"nourrisson",label:"Nourrisson"},
      {id:"militaireCorps",label:"Militaire du corps"},{id:"militaire",label:"Militaire"},{id:"policier",label:"Policier"}
    ];
    const statutGrid = el("div", { class: "grid-2", style: "margin-bottom:8px" });
    statuts.forEach(s => {
      const b = el("button", { class: "card" + (v.statut === s.id ? " active" : ""), text: s.label });
      b.style.marginBottom = "0";
      b.addEventListener("click", () => { v.statut = s.id; if (!["militaireCorps","militaire","policier"].includes(s.id)) v.service = null; state.editedMessage = null; render(document.getElementById("app-root")); });
      statutGrid.appendChild(b);
    });
    wrap.appendChild(statutGrid);
    if (["militaireCorps","militaire","policier"].includes(v.statut)) {
      const svcGrid = el("div", { class: "row", style: "margin-bottom:12px" });
      const svcO = el("button", { class: "card card-half" + (v.service === true ? " active" : ""), text: "En position de service" });
      svcO.addEventListener("click", () => { v.service = true; state.editedMessage = null; render(document.getElementById("app-root")); });
      const svcN = el("button", { class: "card card-half" + (v.service === false ? " active" : ""), text: "En position de repos" });
      svcN.addEventListener("click", () => { v.service = false; state.editedMessage = null; render(document.getElementById("app-root")); });
      svcGrid.appendChild(svcO); svcGrid.appendChild(svcN);
      wrap.appendChild(svcGrid);
    }
    wrap.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Catégorisation" }));
    const gravGrid = el("div", { class: "grid-2", style: "margin-bottom:0" });
    [["ua","Urgence absolue"],["ur","Urgence relative"],["acr","Arrêt cardio-respiratoire"],["dcd","Décédée"]].forEach(([id,label]) => {
      const b = el("button", { class: "card" + (v.gravite === id ? " active" : ""), text: label });
      b.style.marginBottom = "0";
      b.addEventListener("click", () => { v.gravite = id; state.editedMessage = null; render(document.getElementById("app-root")); });
      gravGrid.appendChild(b);
    });
    wrap.appendChild(gravGrid);
    container.appendChild(wrap);
  }

  function render(root) {
    root.innerHTML = "";
    renderHeader(root, true);

    const crumbs = ["Contexte","Véhicules","Victime(s)","Moyens","Lieu","Mesures","Équipe médicale","Message"];
    renderStepCrumb(root, "SAV › AVP", crumbs, step, i => { step = i; render(root); });
    root.appendChild(el("div", { class: "progress-track" }, [ el("div", { class: "progress-fill", style: "width:" + ((step+1)/(totalSteps()+1)*100) + "%" }) ]));
    root.appendChild(precedentButton(() => {
      if (step > 0) { step--; if (step === 6 && totalUA() === 0) step--; render(root); }
      else { goTo("intervention-detail"); }
    }));

    if (step === 0) {
      root.appendChild(el("h1", { class: "page-title", text: "Contexte" }));
      [["classique","Accident classique"],["voierapide","Voie rapide / périphérique"]].forEach(([id,label]) => {
        const b = el("button", { class: "card" + (state.contexte === id ? " active" : ""), text: label });
        b.addEventListener("click", () => { state.contexte = id; state.editedMessage = null; step++; render(root); });
        root.appendChild(b);
      });
    }

    else if (step === 1) {
      root.appendChild(el("h1", { class: "page-title", text: "Véhicules impliqués" }));
      state.vehicules.forEach(v => {
        const row = el("div", { class: "vehicule-row" }, [ el("span", { class: "label", text: v.label }) ]);
        const ctr = el("div", { class: "counter" });
        const minus = el("button", { text: "−" });
        minus.addEventListener("click", () => { if (v.count > 0) v.count--; state.editedMessage = null; render(root); });
        const count = el("span", { class: "count", text: String(v.count) });
        const plus = el("button", { text: "+" });
        plus.addEventListener("click", () => { v.count++; state.editedMessage = null; render(root); });
        ctr.appendChild(minus); ctr.appendChild(count); ctr.appendChild(plus);
        row.appendChild(ctr);
        root.appendChild(row);
      });
      const totalActors = state.vehicules.reduce((s,v) => s + v.count, 0);
      if (totalActors === 1) root.appendChild(el("div", { class: "note", text: "Un seul acteur impliqué : le suffixe \"seul\"/\"seule\" sera ajouté automatiquement." }));
      navButtons(root, state.vehicules.some(v => v.count > 0));
    }

    else if (step === 2) {
      root.appendChild(el("h1", { class: "page-title", text: "Victime(s)" }));
      state.victimes.forEach((v, i) => renderVictimeBlock(root, i));
      const addBtn = el("button", { class: "btn-dashed", text: "+ Ajouter une victime" });
      addBtn.addEventListener("click", () => { state.victimes.push({ gravite: null, sexe: null, statut: "aucun", service: null }); render(root); });
      root.appendChild(addBtn);
      navButtons(root, state.victimes.every(v => !!v.gravite && !!v.sexe));
    }

    else if (step === 3) {
      root.appendChild(el("h1", { class: "page-title", text: "Je demande..." }));
      const toggle = el("div", { class: "row", style: "margin-bottom:16px" });
      const oui = el("button", { class: "card card-half" + (state.demande === true ? " active" : ""), text: "Oui" });
      oui.addEventListener("click", () => {
        state.demande = true; state.editedMessage = null;
        const nbVeh = state.vehicules.reduce((s,v) => s + v.count, 0);
        const p = state.moyens.find(x => x.id === "police"); if (p) p.checked = state.contexte === "voierapide" || nbVeh >= 2;
        const d = state.moyens.find(x => x.id === "dirif"); if (d) d.checked = state.contexte === "voierapide";
        const m = state.moyens.find(x => x.id === "medical"); if (m) { m.checked = totalUA() >= 2; if (m.checked && !m.qty) m.qty = 1; }
        render(root);
      });
      const non = el("button", { class: "card card-half" + (state.demande === false ? " active" : ""), text: "Non" });
      non.addEventListener("click", () => { state.demande = false; state.editedMessage = null; render(root); });
      toggle.appendChild(oui); toggle.appendChild(non);
      root.appendChild(toggle);
      if (state.demande === true) {
        root.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Moyens à engager" }));
        const listWrap = el("div", {});
        renderMoyensList(listWrap, state.moyens, () => { state.editedMessage = null; render(root); }, () => { state.editedMessage = null; });
        root.appendChild(listWrap);
        root.appendChild(el("div", { class: "note", text: "Groupe PMA : à demander si le nombre d'urgences absolues va probablement dépasser 5." }));
      }
      navButtons(root, state.demande !== null);
    }

    else if (step === 4) {
      root.appendChild(el("h1", { class: "page-title", text: "Lieu" }));
      if (state.contexte === "voierapide") {
        root.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Type de voie" }));
        const catGrid = el("div", { class: "row", style: "margin-bottom:12px" });
        [["periph","Périphérique"],["autoroute","Autoroute"]].forEach(([id,label]) => {
          const b = el("button", { class: "card card-half" + (state.voieCategorie === id ? " active" : ""), text: label });
          b.addEventListener("click", () => {
            state.voieCategorie = id; state.editedMessage = null;
            state.periphSens = null; state.autorouteNom = null; state.autorouteSens = null;
            render(root);
          });
          catGrid.appendChild(b);
        });
        root.appendChild(catGrid);

        if (state.voieCategorie === "periph") {
          root.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Sens" }));
          const sensGrid = el("div", { class: "row", style: "margin-bottom:12px" });
          [["interieur","Intérieur"],["exterieur","Extérieur"]].forEach(([id,label]) => {
            const b = el("button", { class: "card card-half" + (state.periphSens === id ? " active" : ""), text: label });
            b.addEventListener("click", () => { state.periphSens = id; state.editedMessage = null; render(root); });
            sensGrid.appendChild(b);
          });
          root.appendChild(sensGrid);
        } else if (state.voieCategorie === "autoroute") {
          root.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Autoroute" }));
          const autoGrid = el("div", { class: "grid-2", style: "margin-bottom:12px" });
          ["A1","A3","A4","A6","A12","A13","A14","A86"].forEach(a => {
            const b = el("button", { class: "card" + (state.autorouteNom === a ? " active" : ""), text: a });
            b.style.marginBottom = "0";
            b.addEventListener("click", () => { state.autorouteNom = a; state.editedMessage = null; render(root); });
            autoGrid.appendChild(b);
          });
          root.appendChild(autoGrid);
          if (state.autorouteNom) {
            root.appendChild(el("div", { class: "note", text: "Sens" }));
            const sensGrid = el("div", { class: "row", style: "margin-bottom:12px" });
            [["Sens Paris - Province","Paris → Province"],["Sens Province - Paris","Province → Paris"]].forEach(([val,label]) => {
              const b = el("button", { class: "card card-half" + (state.autorouteSens === val ? " active" : ""), text: label });
              b.addEventListener("click", () => { state.autorouteSens = val; state.editedMessage = null; render(root); });
              sensGrid.appendChild(b);
            });
            root.appendChild(sensGrid);
          }
        }

        const lieuComplete = (state.voieCategorie === "periph" && !!state.periphSens) || (state.voieCategorie === "autoroute" && !!state.autorouteNom && !!state.autorouteSens);
        if (lieuComplete) {
          root.appendChild(labeledInput("Point kilométrique", "36,5", state.pk, v => { state.pk = v; state.editedMessage = null; }));
        }
      } else {
        root.appendChild(labeledInput("Adresse", "40 boulevard de la Chapelle", state.adresse, v => { state.adresse = v; state.editedMessage = null; }));
        root.appendChild(labeledInput("Commune", "Bagnolet", state.commune, v => { state.commune = v; state.editedMessage = null; }));
        const parisBtn = el("button", { class: "card" + (state.paris ? " active" : ""), text: "Paris intra-muros" });
        parisBtn.addEventListener("click", () => { state.paris = !state.paris; state.editedMessage = null; render(root); });
        root.appendChild(parisBtn);
      }
      const canNextLieu = state.contexte === "voierapide"
        ? ((state.voieCategorie === "periph" && !!state.periphSens) || (state.voieCategorie === "autoroute" && !!state.autorouteNom && !!state.autorouteSens))
        : !!state.adresse;
      navButtons(root, canNextLieu);
    }

    else if (step === 5) {
      root.appendChild(el("h1", { class: "page-title", text: "Mesures prises" }));
      root.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Circulation" }));
      [["fluide","Fluide, pas de gêne"],["reduite","Voies interrompues"],["interrompue","Totalement interrompue"]].forEach(([id,label]) => {
        const b = el("button", { class: "card" + (state.circulation === id ? " active" : ""), text: label });
        b.addEventListener("click", () => { state.circulation = id; state.editedMessage = null; render(root); });
        root.appendChild(b);
      });
      if (state.circulation === "reduite") {
        const row = el("div", { class: "row", style: "margin-bottom:12px" });
        const vi = labeledInput("Voies interrompues", "ex: 1", state.voiesInterrompues, v => { state.voiesInterrompues = v; state.editedMessage = null; render(root); }, true);
        vi.style.flex = "1";
        const vt = labeledInput("Total de voies", "ex: 3", state.voiesTotal, v => { state.voiesTotal = v; state.editedMessage = null; render(root); }, true);
        vt.style.flex = "1";
        row.appendChild(vi); row.appendChild(vt);
        root.appendChild(row);
        if (state.voiesInterrompues && state.voiesTotal) {
          root.appendChild(el("div", { class: "note", text: "Aperçu : " + state.voiesInterrompues + " voie" + (parseInt(state.voiesInterrompues) > 1 ? "s" : "") + " interrompue" + (parseInt(state.voiesInterrompues) > 1 ? "s" : "") + " sur " + state.voiesTotal }));
        }
      }
      const perimBtn = el("button", { class: "card" + (state.perimetre ? " active" : ""), text: "Périmètre de sécurité" });
      perimBtn.addEventListener("click", () => { state.perimetre = !state.perimetre; state.editedMessage = null; render(root); });
      root.appendChild(perimBtn);
      navButtons(root, !!state.circulation);
    }

    else if (step === 6) {
      root.appendChild(el("h1", { class: "page-title", text: "Équipe médicale" }));
      const typeGrid = el("div", { class: "row", style: "margin-bottom:14px" });
      const ar = el("button", { class: "card card-half" + (state.eqType === "ar" ? " active" : ""), text: "AR" });
      ar.addEventListener("click", () => { state.eqType = "ar"; state.eqChoix = null; state.editedMessage = null; render(root); });
      const civ = el("button", { class: "card card-half" + (state.eqType === "civ" ? " active" : ""), text: "Équipe civile" });
      civ.addEventListener("click", () => { state.eqType = "civ"; state.eqChoix = null; state.editedMessage = null; render(root); });
      typeGrid.appendChild(ar); typeGrid.appendChild(civ);
      root.appendChild(typeGrid);
      if (state.eqType === "civ") {
        root.appendChild(labeledInput("Équipe médicale ...", "Lariboisière", state.hopital, v => { state.hopital = v; state.editedMessage = null; }));
        [["presente","Déjà présentée sur les lieux"],["attente","Demandée, on attend"]].forEach(([id,label]) => {
          const b = el("button", { class: "card" + (state.eqChoix === id ? " active" : ""), text: label });
          b.addEventListener("click", () => { state.eqChoix = state.eqChoix === id ? null : id; state.editedMessage = null; render(root); });
          root.appendChild(b);
        });
      } else if (state.eqType === "ar") {
        const b = el("button", { class: "card" + (state.eqChoix === "attente" ? " active" : ""), text: "Demandée, on attend" });
        b.addEventListener("click", () => { state.eqChoix = state.eqChoix === "attente" ? null : "attente"; state.editedMessage = null; render(root); });
        root.appendChild(b);
      }
      navButtons(root, !!state.eqType && (state.eqType === "civ" ? !!state.eqChoix : true));
    }

    else if (step === 7) {
      root.appendChild(el("h1", { class: "page-title", text: "Message généré" }));
      renderMessageEditor(root, {
        getText: currentMessage,
        isEditing: () => state.editing,
        setEditing: v => { state.editing = v; },
        setEdited: v => { state.editedMessage = v; },
        isEdited: () => state.editedMessage !== null,
        rerender: () => render(root)
      });
      const radioBtn = el("button", { class: "btn-primary", text: "Visualiser en grand", style: "width:100%; margin-bottom:8px" });
      radioBtn.addEventListener("click", () => showRadioView(currentMessage, "avp"));
      root.appendChild(radioBtn);
      const saveBtn = el("button", { class: "btn-secondary", text: state.saved ? "Enregistré" : "Enregistrer", style: "width:100%" });
      saveBtn.addEventListener("click", () => {
        state.saved = true;
        addMessageToIntervention(ivId, "AVP", currentMessage());
        saveIvData(ivId, {
          victimes: JSON.parse(JSON.stringify(state.victimes)), eqType: state.eqType, hopital: state.hopital,
          moyensPublics: state.moyens.filter(m => m.section === "public" && m.checked).map(m => m.id),
          moyensDemandes: unionMoyensDemandes(ivId, state.moyens.filter(m => m.checked).map(m => m.id)),
          perimetre: !!state.perimetre
        });
        render(root);
      });
      root.appendChild(saveBtn);
      if (state.saved) {
        const iv = getIntervention(ivId);
        renderMiniHistory(root, ivId);
        root.appendChild(el("h2", { class: "section-title", text: "Suite" }));
        if (iv) {
          const db = el("button", { class: "card", text: "Message de demande" });
          db.addEventListener("click", () => { DemandeSeule.start(iv); goTo("demande-seule"); });
          root.appendChild(db);
          const rb = el("button", { class: "card", text: "Message de renseignement" });
          rb.addEventListener("click", () => { Renseignement.start(iv); goTo("renseignement"); });
          root.appendChild(rb);
        }
        const cb = el("button", { class: "btn-ghost", text: "Clôturer l'intervention" });
        cb.addEventListener("click", () => { if (iv) { iv.status = "cloturee"; updateIntervention(iv); } goTo("home"); });
        root.appendChild(cb);
      }
    }
  }

  return { reset, render };
})();

/* ============================================================
   MODULE MESSAGE DE RENSEIGNEMENT (tiroirs fermés : services publics,
   équipe médicale civile, victime(s), dénombrement terrain définitif)
   ============================================================ */
const Renseignement = (function () {
  let ivId = null;
  let step = 0;
  let victimes = [];
  let eqType = null, hopital = "";
  let moyensPublics = [], perimetre = false;
  let svc = { police: {}, dirif: {}, escorte: {}, eqMed: {} };
  let operationTerminee = false;
  let saved = false, editing = false, editedMessage = null;

  function start(iv) {
    ivId = iv.id;
    const data = iv.data || {};
    victimes = (data.victimes && data.victimes.length ? data.victimes : [ { sexe: null, statut: "aucun", service: null } ])
      .map(v => ({
        sexe: v.sexe, statut: v.statut, service: v.service,
        devenirGravite: v.devenirGravite || null, transportChoix: v.transportChoix || null, dispositionChoix: v.dispositionChoix || null,
        _sexeOpen: !v.sexe, _statutOpen: false
      }));
    eqType = data.eqType || null;
    hopital = data.hopital || "";
    moyensPublics = data.moyensPublics || [];
    perimetre = !!data.perimetre;
    const pres = data.presence || {};
    ["police","dirif","escorte","eqMed"].forEach(key => {
      const prior = pres[key];
      svc[key] = prior && prior.choix
        ? { choix: prior.choix, heure: prior.heure || "", announcedBefore: true }
        : { choix: null, heure: "", announcedBefore: false };
    });
    operationTerminee = false;
    step = 0; saved = false; editing = false; editedMessage = null;
  }

  function escorteFold(txt, ctx) {
    if (!svc.escorte.choix) return txt;
    if (svc.escorte.choix === "presente") {
      txt += " sous escorte motorisée présentée" + (!svc.escorte.announcedBefore && svc.escorte.heure ? " à " + svc.escorte.heure : "");
      if (!svc.escorte.announcedBefore) ctx.escorteConsumed = true;
    } else {
      txt += " sous escorte motorisée qui se présente";
    }
    return txt;
  }

  function victimClause(v, idx, total, ctx) {
    const label = total > 1 ? "victime " + (idx + 1) : "victime";
    if (v.devenirGravite === "ua" && v.transportChoix === "equipe") {
      let txt = label + " UA évacuée par équipe médicale";
      if (eqType === "civ") txt += " " + (hopital || "[hôpital]");
      if (svc.eqMed.choix === "presente" && !svc.eqMed.announcedBefore) {
        txt += " présentée" + (svc.eqMed.heure ? " à " + svc.eqMed.heure : "");
        ctx.eqMedConsumed = true;
      }
      return escorteFold(txt, ctx);
    }
    if (v.devenirGravite === "ua" && v.transportChoix === "vous") return escorteFold(label + " évacuée par nos soins", ctx);
    if (v.devenirGravite === "dcd" && v.dispositionChoix === "police") {
      let txt = label + " décédée laissée à disposition de la police";
      if (svc.police.choix === "presente" && !svc.police.announcedBefore) {
        txt += " présentée" + (svc.police.heure ? " à " + svc.police.heure : "");
        ctx.policeConsumed = true;
      }
      return txt;
    }
    if (v.devenirGravite === "dcd" && v.dispositionChoix === "famille") return label + " décédée laissée à disposition de la famille";
    return null;
  }

  function generateMessage() {
    const ctx = { policeConsumed: false, eqMedConsumed: false, escorteConsumed: false };
    const victimClauses = victimes.map((v, i) => victimClause(v, i, victimes.length, ctx)).filter(Boolean);

    const perimetreApplies = perimetre && moyensPublics.includes("police") && svc.police.choix === "presente";
    const policeConsumedOverall = ctx.policeConsumed || perimetreApplies;

    const parts = [];
    if (moyensPublics.includes("police") && svc.police.choix && !svc.police.announcedBefore && !policeConsumedOverall) {
      parts.push(svc.police.choix === "presente" ? "police présentée" + (svc.police.heure ? " à " + svc.police.heure : "") : "police se présente");
    }
    if (moyensPublics.includes("dirif") && svc.dirif.choix && !svc.dirif.announcedBefore) {
      parts.push(svc.dirif.choix === "presente" ? "DiRIF présenté" + (svc.dirif.heure ? " à " + svc.dirif.heure : "") : "DiRIF se présente");
    }
    if (moyensPublics.includes("escorte") && svc.escorte.choix && !svc.escorte.announcedBefore && !ctx.escorteConsumed) {
      parts.push(svc.escorte.choix === "presente" ? "escorte motorisée présentée" + (svc.escorte.heure ? " à " + svc.escorte.heure : "") : "escorte motorisée se présente");
    }
    if (eqType === "civ" && svc.eqMed.choix && !svc.eqMed.announcedBefore && !ctx.eqMedConsumed) {
      parts.push(svc.eqMed.choix === "presente" ? "équipe médicale " + (hopital || "[hôpital]") + " présentée" + (svc.eqMed.heure ? " à " + svc.eqMed.heure : "") : "équipe médicale " + (hopital || "[hôpital]") + " se présente");
    }

    parts.push(...victimClauses);

    if (perimetreApplies) {
      let txt = "périmètre de sécurité laissé à disposition de la police";
      if (!ctx.policeConsumed && !svc.police.announcedBefore) {
        txt += " présentée" + (svc.police.heure ? " à " + svc.police.heure : "");
      }
      parts.push(txt);
    }

    let msg = "";
    if (parts.length > 0) {
      msg = parts.join(", ");
      msg = msg.charAt(0).toUpperCase() + msg.slice(1) + ".";
    }
    if (operationTerminee) msg += (msg ? " " : "") + "Opération terminée.";
    return msg || "…";
  }
  function currentMessage() { return editedMessage !== null ? editedMessage : generateMessage(); }

  function renderVictimeBlock(container, index) {
    const v = victimes[index];
    const wrap = el("div", { class: "victime-block" });
    const hdr = el("div", { class: "victime-header" }, [ el("span", { text: "Victime " + (index + 1) }) ]);
    if (victimes.length > 1) {
      hdr.appendChild(el("button", { class: "remove-link", text: "Retirer", onclick: () => { victimes.splice(index, 1); editedMessage = null; render(document.getElementById("app-root")); } }));
    }
    wrap.appendChild(hdr);

    const sexeLabels = { homme: "Homme", femme: "Femme" };
    const sexeToggle = el("button", { class: "victime-field-toggle", text: (v._sexeOpen ? "▾ " : "▸ ") + "Sexe : " + (sexeLabels[v.sexe] || "non renseigné") });
    sexeToggle.addEventListener("click", () => { v._sexeOpen = !v._sexeOpen; render(document.getElementById("app-root")); });
    wrap.appendChild(sexeToggle);
    if (v._sexeOpen) {
      const sexeGrid = el("div", { class: "row", style: "margin: 6px 0 12px" });
      ["homme","femme"].forEach(s => {
        const b = el("button", { class: "card card-half" + (v.sexe === s ? " active" : ""), text: s[0].toUpperCase() + s.slice(1) });
        b.addEventListener("click", () => { v.sexe = s; editedMessage = null; render(document.getElementById("app-root")); });
        sexeGrid.appendChild(b);
      });
      wrap.appendChild(sexeGrid);
    }

    const statuts = [
      {id:"aucun",label:"Aucun"},{id:"enfant",label:"Enfant"},{id:"nourrisson",label:"Nourrisson"},
      {id:"militaireCorps",label:"Militaire du corps"},{id:"militaire",label:"Militaire"},{id:"policier",label:"Policier"}
    ];
    const statutLabel = (statuts.find(s => s.id === v.statut) || statuts[0]).label;
    const statutToggle = el("button", { class: "victime-field-toggle", text: (v._statutOpen ? "▾ " : "▸ ") + "Statut particulier : " + statutLabel });
    statutToggle.addEventListener("click", () => { v._statutOpen = !v._statutOpen; render(document.getElementById("app-root")); });
    wrap.appendChild(statutToggle);
    if (v._statutOpen) {
      const statutGrid = el("div", { class: "grid-2", style: "margin: 6px 0 8px" });
      statuts.forEach(s => {
        const b = el("button", { class: "card" + (v.statut === s.id ? " active" : ""), text: s.label });
        b.style.marginBottom = "0";
        b.addEventListener("click", () => { v.statut = s.id; if (!["militaireCorps","militaire","policier"].includes(s.id)) v.service = null; editedMessage = null; render(document.getElementById("app-root")); });
        statutGrid.appendChild(b);
      });
      wrap.appendChild(statutGrid);
      if (["militaireCorps","militaire","policier"].includes(v.statut)) {
        const svcGrid = el("div", { class: "row", style: "margin-bottom:12px" });
        const svcO = el("button", { class: "card card-half" + (v.service === true ? " active" : ""), text: "En position de service" });
        svcO.addEventListener("click", () => { v.service = true; editedMessage = null; render(document.getElementById("app-root")); });
        const svcN = el("button", { class: "card card-half" + (v.service === false ? " active" : ""), text: "En position de repos" });
        svcN.addEventListener("click", () => { v.service = false; editedMessage = null; render(document.getElementById("app-root")); });
        svcGrid.appendChild(svcO); svcGrid.appendChild(svcN);
        wrap.appendChild(svcGrid);
      }
    }
    wrap.appendChild(el("div", { class: "note", style: "margin-top:8px", text: "Devenir de la victime" }));
    const devGrid = el("div", { class: "grid-2", style: "margin-bottom:8px" });
    [["","Pas déterminé"],["ua","Urgence absolue"],["ur","Urgence relative"],["dcd","Décédée"]].forEach(([id,label]) => {
      const val = id === "" ? null : id;
      const b = el("button", { class: "card" + (v.devenirGravite === val ? " active" : ""), text: label });
      b.style.marginBottom = "0";
      b.addEventListener("click", () => { v.devenirGravite = val; v.transportChoix = null; v.dispositionChoix = null; editedMessage = null; render(document.getElementById("app-root")); });
      devGrid.appendChild(b);
    });
    wrap.appendChild(devGrid);
    if (v.devenirGravite === "ua") {
      wrap.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Évacuée par" }));
      const grid = el("div", { class: "row", style: "margin-bottom:0" });
      [["equipe","Équipe médicale"],["vous","Vous"]].forEach(([id,label]) => {
        const b = el("button", { class: "card card-half" + (v.transportChoix === id ? " active" : ""), text: label });
        b.addEventListener("click", () => { v.transportChoix = v.transportChoix === id ? null : id; editedMessage = null; render(document.getElementById("app-root")); });
        grid.appendChild(b);
      });
      wrap.appendChild(grid);
    } else if (v.devenirGravite === "dcd") {
      wrap.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Laissée à disposition de" }));
      const grid = el("div", { class: "row", style: "margin-bottom:0" });
      [["police","La police"],["famille","La famille"]].forEach(([id,label]) => {
        const b = el("button", { class: "card card-half" + (v.dispositionChoix === id ? " active" : ""), text: label });
        b.addEventListener("click", () => { v.dispositionChoix = v.dispositionChoix === id ? null : id; editedMessage = null; render(document.getElementById("app-root")); });
        grid.appendChild(b);
      });
      wrap.appendChild(grid);
    }
    container.appendChild(wrap);
  }

  function renderServiceChoice(root, key, label) {
    root.appendChild(el("div", { class: "note", style: "margin-top:0", text: label }));
    if (svc[key].announcedBefore) {
      root.appendChild(el("div", { class: "note", text: label + " déjà annoncé" + (label === "Équipe médicale" ? "e" : "") + (svc[key].heure ? " à " + svc[key].heure : "") + "." }));
      return;
    }
    const grid = el("div", { class: "row", style: "margin-bottom:12px" });
    [["sepresente","Se présente"],["presente","Présentée à..."]].forEach(([id,label2]) => {
      const b = el("button", { class: "card card-half" + (svc[key].choix === id ? " active" : ""), text: label2 });
      b.addEventListener("click", () => { svc[key].choix = svc[key].choix === id ? null : id; editedMessage = null; render(root); });
      grid.appendChild(b);
    });
    root.appendChild(grid);
    if (svc[key].choix === "presente") {
      const wrap = labeledInput("Heure de présentation", "ex: 1530", svc[key].heure, v => { svc[key].heure = v; editedMessage = null; });
      wrap.querySelector("input").addEventListener("blur", () => render(root));
      root.appendChild(wrap);
    }
  }

  function render(root) {
    root.innerHTML = "";
    renderHeader(root, true);
    root.appendChild(el("div", { class: "crumb", text: "Message de renseignement" }));

    if (step === 0) {
      root.appendChild(el("h1", { class: "page-title", text: "Éléments à transmettre" }));
      root.appendChild(precedentButton(() => goTo("intervention-detail")));

      const anyService = moyensPublics.includes("police") || moyensPublics.includes("dirif") || moyensPublics.includes("escorte") || eqType === "civ";
      if (anyService) {
        root.appendChild(el("h2", { class: "section-title", text: "Moyens engagés" }));
        if (moyensPublics.includes("police")) renderServiceChoice(root, "police", "Police");
        if (moyensPublics.includes("escorte")) renderServiceChoice(root, "escorte", "Escorte motorisée");
        if (eqType === "civ") {
          if (svc.eqMed.announcedBefore) {
            root.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Équipe médicale " + (hopital || "") + " déjà annoncée" + (svc.eqMed.heure ? " à " + svc.eqMed.heure : "") + "." }));
          } else {
            root.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Équipe médicale civile" }));
            root.appendChild(labeledInput("Équipe médicale ...", "Lariboisière", hopital, v => { hopital = v; editedMessage = null; }));
            renderServiceChoice(root, "eqMed", "Présence");
          }
        }
        if (moyensPublics.includes("dirif")) renderServiceChoice(root, "dirif", "DiRIF");
      }

      root.appendChild(el("h2", { class: "section-title", text: "Victime(s)" }));
      victimes.forEach((v, i) => renderVictimeBlock(root, i));
      const addBtn = el("button", { class: "btn-dashed", text: "+ Ajouter une victime" });
      addBtn.addEventListener("click", () => { victimes.push({ sexe: null, statut: "aucun", service: null, devenirGravite: null, transportChoix: null, dispositionChoix: null, _sexeOpen: true, _statutOpen: true }); editedMessage = null; render(root); });
      root.appendChild(addBtn);

      const opBtn = el("button", { class: "card" + (operationTerminee ? " active" : ""), text: "Opération terminée", style: "margin-top:8px" });
      opBtn.addEventListener("click", () => { operationTerminee = !operationTerminee; editedMessage = null; render(root); });
      root.appendChild(opBtn);

      const nav = el("div", { class: "nav-buttons" });
      const next = el("button", { class: "btn-primary", text: "Suivant" });
      next.addEventListener("click", () => { editedMessage = null; step = 1; render(root); });
      nav.appendChild(next);
      root.appendChild(nav);
      return;
    }

    root.appendChild(el("h1", { class: "page-title", text: "Message généré" }));
    root.appendChild(precedentButton(() => { step = 0; render(root); }));
    renderMessageEditor(root, {
      getText: currentMessage,
      isEditing: () => editing,
      setEditing: v => { editing = v; },
      setEdited: v => { editedMessage = v; },
      isEdited: () => editedMessage !== null,
      rerender: () => render(root)
    });

    const radioBtn = el("button", { class: "btn-primary", text: "Visualiser en grand", style: "width:100%; margin-bottom:8px" });
    radioBtn.addEventListener("click", () => showRadioView(currentMessage, "renseignement"));
    root.appendChild(radioBtn);
    const saveBtn = el("button", { class: "btn-secondary", text: saved ? "Enregistré" : "Enregistrer", style: "width:100%" });
    saveBtn.addEventListener("click", () => {
      saved = true;
      const motif = getIntervention(ivId).motif || "";
      addMessageToIntervention(ivId, motif + " — renseignement", currentMessage());
      const presence = {};
      ["police","dirif","escorte","eqMed"].forEach(key => {
        if (svc[key].choix) presence[key] = { choix: svc[key].choix, heure: svc[key].heure };
      });
      saveIvData(ivId, { victimes: JSON.parse(JSON.stringify(victimes)), eqType: eqType, hopital: hopital, moyensPublics: moyensPublics, perimetre: perimetre, presence: presence });
      if (operationTerminee) {
        const ivFresh = getIntervention(ivId);
        if (ivFresh) { ivFresh.status = "cloturee"; updateIntervention(ivFresh); }
      }
      render(root);
    });
    root.appendChild(saveBtn);
    if (saved) {
      renderMiniHistory(root, ivId);
      if (operationTerminee) {
        root.appendChild(el("div", { class: "note", style: "text-align:center; margin-top:12px;", text: "Intervention clôturée." }));
      } else {
        root.appendChild(el("h2", { class: "section-title", text: "Suite" }));
        const db = el("button", { class: "card", text: "Message de demande" });
        db.addEventListener("click", () => { DemandeSeule.start(getIntervention(ivId)); goTo("demande-seule"); });
        root.appendChild(db);
        const rb = el("button", { class: "card", text: "Nouveau renseignement" });
        rb.addEventListener("click", () => { start(getIntervention(ivId)); render(root); });
        root.appendChild(rb);
        const cb = el("button", { class: "btn-ghost", text: "Clôturer l'intervention" });
        cb.addEventListener("click", () => { const iv2 = getIntervention(ivId); if (iv2) { iv2.status = "cloturee"; updateIntervention(iv2); } goTo("home"); });
        root.appendChild(cb);
      }
    }
  }

  return { start, render };
})();

renderApp();
</script>
</body>
</html>
