<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Messages Radio — BSPP</title>
<style>
  :root {
    --bg: #0b0e12;
    --surface-1: #12161c;
    --surface-2: #1a2029;
    --border: #2a323d;
    --border-strong: #3a4552;
    --border-accent: #d9a441;
    --accent: #d9a441;
    --on-accent: #14100a;
    --text-primary: #f3f5f7;
    --text-secondary: #a7b0bc;
    --text-muted: #6b7480;
    --radius: 14px;
    --danger: #c14f4f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app-root {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 1rem 1rem 3rem;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.5rem 0 1rem;
  }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .header .brand {
    font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 600;
  }
  .header .brand span { color: var(--accent); }
  .role-badge {
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    padding: 3px 8px; border-radius: 999px; border: 0.5px solid var(--border-accent);
    color: var(--accent); background: rgba(217,164,65,0.1);
  }
  .role-pill {
    font-size: 12px; font-weight: 700; letter-spacing: .03em;
    padding: 8px 14px; border-radius: 999px; border: 0.5px solid var(--border-accent);
    color: var(--accent); background: rgba(217,164,65,0.1); cursor: pointer;
  }
  .role-dropdown {
    position: absolute; top: 44px; right: 0; z-index: 20;
    background: var(--surface-2); border: 0.5px solid var(--border-strong); border-radius: 12px;
    padding: 6px; min-width: 160px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .role-dropdown-item {
    display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px;
    border: none; background: transparent; color: var(--text-primary); font-size: 14px; cursor: pointer;
  }
  .role-dropdown-item.active { color: var(--accent); font-weight: 700; }
  .role-dropdown-item.disabled { opacity: 0.4; cursor: not-allowed; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    border: 0.5px solid var(--border); background: var(--surface-2);
    color: var(--text-secondary); font-size: 16px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .crumb { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; min-height: 16px; }
  .progress-track {
    height: 3px; background: var(--border); border-radius: 2px;
    margin-bottom: 18px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--accent); transition: width .2s; }
  h1.page-title { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
  h2.section-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .card {
    text-align: left; width: 100%; padding: 14px; border-radius: var(--radius);
    font-size: 15px; font-weight: 500; cursor: pointer;
    border: 0.5px solid var(--border); background: var(--surface-2);
    color: var(--text-primary); margin-bottom: 8px; display: block;
    transition: background .12s, border-color .12s, color .12s;
  }
  .card:hover { border-color: var(--border-strong); }
  .card.active {
    background: var(--accent); border-color: var(--accent); color: var(--on-accent);
  }
  .card.disabled { opacity: 0.4; cursor: not-allowed; }
  .card-half { flex: 1; }
  .row { display: flex; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label.field-label {
    font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 4px;
  }
  input[type="text"] {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 0.5px solid var(--border); background: var(--surface-1);
    color: var(--text-primary); font-size: 15px; margin-bottom: 12px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .note { font-size: 12px; color: var(--text-muted); margin: -4px 0 12px; }
  .nav-buttons { display: flex; gap: 8px; margin-top: 20px; }
  .btn-primary {
    flex: 1; padding: 13px; border-radius: var(--radius); border: none;
    background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary {
    flex: 1; padding: 13px; border-radius: var(--radius);
    border: 0.5px solid var(--border-strong); background: var(--surface-2);
    color: var(--text-primary); font-size: 15px; font-weight: 500; cursor: pointer;
  }
  .btn-ghost {
    width: 100%; padding: 12px; border-radius: var(--radius);
    border: 0.5px solid var(--border); background: transparent;
    color: var(--text-secondary); font-size: 13px; cursor: pointer; margin-top: 8px;
  }
  .btn-dashed {
    width: 100%; padding: 10px; border-radius: var(--radius);
    border: 0.5px dashed var(--border-strong); background: transparent;
    color: var(--text-secondary); font-size: 13px; cursor: pointer; margin-bottom: 8px;
  }
  .victime-block {
    border: 0.5px solid var(--border); border-radius: var(--radius);
    padding: 12px; margin-bottom: 12px;
  }
  .victime-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .victime-header span { font-size: 13px; font-weight: 600; }
  .remove-link {
    font-size: 12px; color: var(--text-muted); background: none; border: none;
    cursor: pointer; padding: 0;
  }
  .precedent-link {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 13px; color: var(--text-muted); background: none; border: none;
    cursor: pointer; padding: 2px 0; margin: -6px 0 14px;
  }
  .precedent-link:hover { color: var(--text-secondary); }
  .crumb-step {
    font: inherit; color: inherit; background: none; border: none; padding: 0; margin: 0;
    cursor: default;
  }
  .crumb-step.done { cursor: pointer; color: var(--text-secondary); }
  .crumb-step.done:hover { color: var(--accent); }
  .crumb-step.current { color: var(--text-secondary); font-weight: 700; }
  .victime-field-toggle {
    display: block; width: 100%; text-align: left; font-size: 12px; color: var(--text-muted);
    background: none; border: none; cursor: pointer; padding: 4px 0; margin: 0;
  }
  .victime-field-toggle:hover { color: var(--text-secondary); }
  @keyframes slideDownFade {
    from { opacity: 0; transform: translateY(-14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .history-drop { animation: slideDownFade .4s ease; }
  .axe-sav { border-color: #5b9bd5; background: rgba(91,155,213,0.12); color: #8ec4f0; }
  .axe-inc { border-color: #d97b4f; background: rgba(217,123,79,0.12); color: #f0a884; }
  .moyen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .moyen-chip {
    padding: 12px 10px; border-radius: 12px; cursor: pointer;
    border: 1.5px solid var(--border); background: var(--surface-2);
    display: flex; flex-direction: column; gap: 6px; min-height: 56px; justify-content: center;
  }
  .moyen-chip.checked { border-color: var(--accent); background: rgba(217,164,65,0.12); }
  .moyen-chip.disabled { opacity: 0.35; cursor: not-allowed; }
  .moyen-chip .chip-top { display: flex; align-items: center; gap: 8px; }
  .moyen-chip .chip-icon { font-size: 16px; line-height: 1; flex-shrink: 0; }
  .moyen-chip .chip-label { font-size: 12.5px; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; line-height: 1.25; }
  .moyen-chip .chip-qty {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 2px; padding-top: 6px; border-top: 0.5px solid var(--border);
  }
  .moyen-chip .chip-qty button {
    width: 24px; height: 24px; border-radius: 7px; border: 0.5px solid var(--border-strong);
    background: var(--surface-1); color: var(--text-primary); font-size: 13px; cursor: pointer;
  }
  .moyen-chip .chip-qty .qty-val { font-size: 13px; font-weight: 700; }
  .moyen-sub-full { grid-column: 1 / -1; }
  .vehicule-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border: 0.5px solid var(--border); border-radius: var(--radius);
    margin-bottom: 8px;
  }
  .vehicule-row .label { font-size: 14px; font-weight: 500; }
  .counter { display: flex; align-items: center; gap: 10px; }
  .counter button {
    width: 30px; height: 30px; border-radius: 8px; border: 0.5px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 16px; cursor: pointer;
  }
  .counter .count { font-size: 14px; font-weight: 600; min-width: 16px; text-align: center; }
  /* Moyen card avec stepper de quantité inline */
  .moyen-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 12px; border-radius: var(--radius);
    border: 0.5px solid var(--border); background: var(--surface-2);
    margin-bottom: 8px; cursor: pointer;
  }
  .moyen-card.checked { border-color: var(--border-accent); }
  .moyen-card .moyen-label { font-size: 14px; font-weight: 500; flex: 1; }
  .moyen-card .moyen-check {
    width: 20px; height: 20px; border-radius: 6px; border: 0.5px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center; margin-right: 10px; flex-shrink: 0;
  }
  .moyen-card.checked .moyen-check { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; }
  .qty-stepper { display: flex; align-items: center; gap: 8px; }
  .qty-stepper button {
    width: 26px; height: 26px; border-radius: 7px; border: 0.5px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 14px; cursor: pointer;
  }
  .qty-stepper .qty-val { font-size: 14px; font-weight: 600; min-width: 14px; text-align: center; }
  .mea-sub { padding: 0 12px 12px; }
  .message-box-wrap { position: relative; margin-bottom: 16px; }
  .message-box {
    background: var(--surface-2); border: 0.5px solid var(--border); border-radius: var(--radius);
    padding: 14px 44px 14px 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap;
  }
  .edit-btn {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 8px;
    border: 0.5px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px;
  }
  .badge { font-size: 12px; color: var(--text-muted); margin: -10px 0 16px; }
  textarea {
    width: 100%; padding: 14px; border-radius: var(--radius); border: 0.5px solid var(--border-accent);
    background: var(--surface-2); color: var(--text-primary); font-size: 15px; line-height: 1.6;
    font-family: inherit; margin-bottom: 8px; resize: vertical; overflow: hidden; box-sizing: border-box;
  }
  .radio-view {
    min-height: 70vh; background: var(--bg); border-radius: var(--radius);
    padding: 1.5rem 0.5rem; display: flex; flex-direction: column; justify-content: center;
  }
  .radio-text { font-size: 26px; font-weight: 600; line-height: 1.5; }
  .home-hero { margin: 12px 0 20px; }
  .home-hero .kicker { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .home-hero h1 { font-size: 26px; margin: 0; font-weight: 700; }
  .intervention-item {
    border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 8px;
    cursor: pointer;
  }
  .intervention-item .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .intervention-item .motif { font-size: 14px; font-weight: 600; }
  .intervention-item .time { font-size: 12px; color: var(--accent); font-weight: 600; }
  .intervention-item .meta { font-size: 12px; color: var(--text-muted); }
  .intervention-item.closed { opacity: 0.6; }
  .delete-btn {
    width: 26px; height: 26px; border-radius: 8px; border: none; background: transparent;
    color: var(--text-muted); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .delete-btn:hover { color: var(--danger); }
  .delete-btn.confirming { color: var(--danger); font-weight: 700; }
  .history-item {
    border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 8px;
    cursor: pointer;
  }
  .history-item .time { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .history-item .snippet { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
  .empty-state { font-size: 13px; color: var(--text-muted); text-align: center; padding: 32px 0; }
  .disabled-note { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  #app-version {
    position: fixed; left: 0; right: 0; bottom: 6px; text-align: center;
    font-size: 10px; color: var(--text-muted); opacity: 0.55; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app-root"></div>
<div id="app-version">V1.1</div>

<script>
/* ---------- Retour haptique (Android uniquement — iOS Safari ne le permet pas) ---------- */
function haptic(duration) {
  if (navigator.vibrate) navigator.vibrate(duration || 8);
}
document.addEventListener("click", function (e) {
  if (e.target.closest && e.target.closest("button")) haptic();
}, true);

/* ---------- Utilitaires partagés ---------- */
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  (children || []).forEach(c => c && e.appendChild(c));
  return e;
}
function labeledInput(labelText, placeholder, value, onInput, numeric) {
  const wrap = el("div", {});
  wrap.appendChild(el("label", { class: "field-label", text: labelText }));
  const input = el("input", { type: "text", placeholder: placeholder });
  if (numeric) input.inputMode = "numeric";
  input.value = value || "";
  input.addEventListener("input", e => onInput(numeric ? e.target.value.replace(/[^0-9]/g, "") : e.target.value));
  if (numeric) input.addEventListener("input", e => { e.target.value = e.target.value.replace(/[^0-9]/g,""); });
  wrap.appendChild(input);
  return wrap;
}
function autoResize(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }
function renderMessageEditor(container, opts) {
  if (!opts.isEditing()) {
    const boxWrap = el("div", { class: "message-box-wrap" });
    const box = el("div", { class: "message-box", text: opts.getText() });
    box.style.cursor = "pointer";
    box.addEventListener("click", () => { opts.setEditing(true); opts.rerender(); });
    const editBtn = el("button", { class: "edit-btn", text: "✎" });
    editBtn.addEventListener("click", (e) => { e.stopPropagation(); opts.setEditing(true); opts.rerender(); });
    boxWrap.appendChild(box); boxWrap.appendChild(editBtn);
    container.appendChild(boxWrap);
    if (opts.isEdited && opts.isEdited()) container.appendChild(el("div", { class: "badge", text: "Modifié manuellement" }));
  } else {
    const ta = el("textarea", {});
    ta.value = opts.getText();
    ta.addEventListener("input", () => autoResize(ta));
    container.appendChild(ta);
    setTimeout(() => autoResize(ta), 0);
    const nav = el("div", { class: "row", style: "margin-bottom:16px" });
    const cancel = el("button", { class: "btn-secondary", text: "Annuler" });
    cancel.addEventListener("click", () => { opts.setEditing(false); opts.rerender(); });
    const valid = el("button", { class: "btn-primary", text: "Valider" });
    valid.addEventListener("click", () => { opts.setEdited(ta.value); opts.setEditing(false); opts.rerender(); });
    nav.appendChild(cancel); nav.appendChild(valid);
    container.appendChild(nav);
  }
}

function precedentButton(onClick) {
  return el("button", { class: "precedent-link", text: "‹ Précédent", onclick: onClick });
}
function renderStepCrumb(root, prefix, stepLabels, currentStep, onJump) {
  const crumb = el("div", { class: "crumb" });
  crumb.appendChild(document.createTextNode(prefix + " › "));
  stepLabels.forEach((label, i) => {
    if (i > 0) crumb.appendChild(document.createTextNode(" › "));
    const cls = "crumb-step" + (i === currentStep ? " current" : i < currentStep ? " done" : "");
    const btn = el("button", { class: cls, text: label });
    if (i < currentStep) btn.addEventListener("click", () => onJump(i));
    crumb.appendChild(btn);
  });
  root.appendChild(crumb);
}

const specialNouns = {
  enfant: { m: "enfant", f: "enfant" },
  nourrisson: { m: "nourrisson", f: "nourrisson" },
  militaireCorps: { m: "sapeur-pompier de Paris", f: "sapeur-pompier de Paris" },
  militaire: { m: "militaire", f: "militaire" },
  policier: { m: "policier", f: "policière" }
};
function victimeNoun(v) {
  if (v.statut !== "aucun" && specialNouns[v.statut]) {
    const isF = v.sexe === "femme";
    let txt = (isF ? "une " : "un ") + specialNouns[v.statut][isF ? "f" : "m"];
    if (v.service !== null && ["militaireCorps","militaire","policier"].includes(v.statut)) {
      txt += v.service ? " en position de service" : " en position de repos";
    }
    return txt;
  }
  return v.sexe === "femme" ? "une femme" : "un homme";
}
function denombrementText(victimes, label) {
  const n = victimes.length;
  if (n === 0) return "dénombrement terrain " + label + " : aucune victime recensée";
  const dcdCount = victimes.filter(v => (v.gravite || "acr") === "dcd").length;
  const uaCount = victimes.filter(v => (v.gravite || "acr") === "ua").length;
  const acrCount = victimes.filter(v => (v.gravite || "acr") === "acr").length;
  const urCount = victimes.filter(v => (v.gravite || "acr") === "ur").length;
  const uaTotal = uaCount + acrCount;

  const parts = [];
  if (dcdCount > 0) parts.push((dcdCount === 1 ? "un" : dcdCount) + " décès certain" + (dcdCount > 1 ? "s" : ""));
  if (uaTotal > 0) {
    let txt = (uaTotal === 1 ? "une" : uaTotal) + " victime" + (uaTotal > 1 ? "s" : "") + " UA";
    if (acrCount > 0) txt += " dont " + (acrCount === 1 ? "une" : acrCount) + " en ACR";
    parts.push(txt);
  }
  if (urCount > 0) parts.push((urCount === 1 ? "une" : urCount) + " UR");

  let txt = "dénombrement terrain " + label + " : ";
  if (parts.length === 0) txt += "aucune victime recensée";
  else if (parts.length === 1) txt += parts[0];
  else txt += parts.slice(0, -1).join(", ") + ", et " + parts[parts.length - 1];

  const specials = victimes.filter(v => v.statut !== "aucun").map(v => victimeNoun(v));
  if (specials.length > 0) txt += " dont " + specials.join(", ");
  return txt;
}

const moyenIcons = {
  eps: "🚨", grimp: "🧗", medical: "🩺", ssuap: "🏥", ep: "🚒", vsav: "🚑",
  mea: "🪜", brisevue: "🧱", police: "🚓", dirif: "🛣️", escorte: "🏍️",
  helico: "🚁", eqmed: "⛑️", bariatrique: "🛏️", multiparam: "📟", pma: "⛺",
  manoeuvreForceEquipe: "💪", manoeuvreForceGroupe: "🛠️",
  planRouge: "🔴", planRougeAlpha: "🔴", gdf: "⚡", enedis: "⚡"
};

/* Composant réutilisable : grille 2 colonnes de moyens à cocher, groupée par section, quantité inline, sous-choix par moyen */
function renderMoyensList(container, moyens, onChange, resetEdited) {
  function renderSub(subContainer, m) {
    if (m.hasMea) {
      const grid = el("div", { class: "row" });
      [["reco","Reconnaissance d'appartement"],["brancardage","Brancardage"]].forEach(([id,lbl]) => {
        const b = el("button", { class: "card card-half" + (m.meaMotif === id ? " active" : ""), text: lbl });
        b.style.fontSize = "13px"; b.style.padding = "10px";
        b.addEventListener("click", () => { m.meaMotif = id; onChange(); });
        grid.appendChild(b);
      });
      subContainer.appendChild(grid);
    } else if (m.id === "escorte") {
      const wrap = labeledInput("Destination hospitalière (optionnel)", "Necker", m.escorteHopital || "", v => { m.escorteHopital = v; if (resetEdited) resetEdited(); });
      const input = wrap.querySelector("input");
      input.addEventListener("blur", () => onChange());
      subContainer.appendChild(wrap);
    } else if (m.id === "helico") {
      const grid = el("div", { class: "row", style: "margin-bottom:8px" });
      [["treuillage","Hélitreuillage"],["poser","Zone de poser"]].forEach(([id,lbl]) => {
        const b = el("button", { class: "card card-half" + (m.helicoMotif === id ? " active" : ""), text: lbl });
        b.style.fontSize = "13px"; b.style.padding = "10px";
        b.addEventListener("click", () => { m.helicoMotif = id; onChange(); });
        grid.appendChild(b);
      });
      subContainer.appendChild(grid);
      if (m.helicoMotif === "poser") {

        adresseWrap.querySelector("input").addEventListener("blur", () => onChange());
        subContainer.appendChild(adresseWrap);
      }
    } else if (m.id === "eqmed" || m.id === "medical") {

      [[true,"Coordination contactée"],[false,"Coordination non contactée"]].forEach(([val,lbl]) => {

        b.style.fontSize = "13px"; b.style.padding = "10px";
        b.addEventListener("click", () => { m.coordinationContactee = m.coordinationContactee === val ? null : val; onChange(); });
        grid.appendChild(b);
      });
      subContainer.appendChild(grid);
    }
  }
  function hasSub(m) { return m.hasMea || m.id === "escorte" || m.id === "helico" || m.id === "eqmed" || m.id === "medical"; }

  function renderSection(label, items) {
    if (items.length === 0) return;
    container.appendChild(el("div", { class: "note", style: "margin-top:12px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:var(--text-secondary);", text: label }));
    const grid = el("div", { class: "moyen-grid" });
    items.forEach(m => {
      const chip = el("div", { class: "moyen-chip" + (m.checked ? " checked" : "") + (m.disabled ? " disabled" : "") });
      const top = el("div", { class: "chip-top" }, [
        el("span", { class: "chip-icon", text: moyenIcons[m.id] || "▫️" }),
        el("span", { class: "chip-label", text: (m.short || m.label) + (m.disabled ? " (bientôt)" : "") })
      ]);
      chip.appendChild(top);
      if (!m.disabled) {
        chip.addEventListener("click", (e) => {
          if (e.target.closest(".chip-qty")) return;
          m.checked = !m.checked;
          if (m.checked && m.hasQty && !m.qty) m.qty = 1;
          if (!m.checked) { m.qty = 0; if (m.hasMea) m.meaMotif = null; if (m.id === "helico") { m.helicoMotif = null; m.helicoAdresse = ""; } if (m.id === "escorte") m.escorteHopital = ""; }
          onChange();
        });
      }
      if (m.checked && m.hasQty) {
        const qtyRow = el("div", { class: "chip-qty" });
        const minus = el("button", { text: "−" });
        minus.addEventListener("click", (e) => { e.stopPropagation(); if (m.qty > 1) m.qty--; onChange(); });
        const val = el("span", { class: "qty-val", text: String(m.qty || 1) });
        const plus = el("button", { text: "+" });
        plus.addEventListener("click", (e) => { e.stopPropagation(); m.qty = (m.qty || 1) + 1; onChange(); });
        qtyRow.appendChild(minus); qtyRow.appendChild(val); qtyRow.appendChild(plus);
        chip.appendChild(qtyRow);
      }
      grid.appendChild(chip);
      if (m.checked && hasSub(m)) {
        const sub = el("div", { class: "mea-sub moyen-sub-full" });
        renderSub(sub, m);
        grid.appendChild(sub);
      }
    });
    container.appendChild(grid);
  }
  renderSection("Moyens brigade", moyens.filter(m => m.section === "brigade"));
  renderSection("Services publics", moyens.filter(m => m.section === "public"));
}
function moyenLabelWithQty(m) {
  const base = m.label.toLowerCase();
  let txt;
  if (!m.hasQty) {
    txt = base;
  } else {
    txt = m.qty > 1 ? m.qty + " " + base + "s" : "un " + base;
  }
  if (m.hasMea && m.meaMotif) txt += m.meaMotif === "reco" ? " pour reconnaissance d'appartement" : " pour brancardage";
  if (m.id === "bariatrique") txt += " pour le transport d'une victime à forte corpulence";
  if (m.id === "escorte") txt += m.escorteHopital ? ", destination hospitalière : " + m.escorteHopital : ", destination hospitalière inconnue";
  if (m.id === "helico" && m.helicoMotif) {
    txt += m.helicoMotif === "treuillage" ? " pour hélitreuillage" : ", zone de poser " + (m.helicoAdresse || "[adresse]");
  }
  return txt;
}
function coordinationSuffix(moyens) {
  const m = moyens.find(x => (x.id === "eqmed" || x.id === "medical") && x.checked);
  if (!m) return "";
  if (m.coordinationContactee === true) return " Coordination médicale contactée.";
  if (m.coordinationContactee === false) return " Coordination médicale non contactée.";
  return "";
}

/* ============================================================
   STOCKAGE — RÔLE + INTERVENTIONS
   ============================================================ */
function getRole() { return localStorage.getItem("role") || null; }
function setRole(r) { localStorage.setItem("role", r); }

function getInterventions() { return JSON.parse(localStorage.getItem("interventions") || "[]"); }
function saveInterventions(list) { localStorage.setItem("interventions", JSON.stringify(list)); }
function createIntervention(axe) {
  const list = getInterventions();
  const iv = {
    id: Date.now(),
    vehicule: getRole() || "Non défini",
    axe: axe,
    motif: null,
    createdAt: new Date().toISOString(),
    status: "ouverte",
    messages: []
  };
  list.unshift(iv);
  saveInterventions(list);
  return iv;
}
function getIntervention(id) { return getInterventions().find(i => i.id === id); }
function updateIntervention(iv) {
  const list = getInterventions();
  const idx = list.findIndex(i => i.id === iv.id);
  if (idx >= 0) list[idx] = iv;
  saveInterventions(list);
}
function saveIvData(ivId, data) {
  const iv = getIntervention(ivId);
  if (!iv) return;
  iv.data = Object.assign({}, iv.data, data);
  updateIntervention(iv);
}
function unionMoyensDemandes(ivId, newIds) {
  const iv = getIntervention(ivId);
  const existing = (iv && iv.data && iv.data.moyensDemandes) || [];
  return Array.from(new Set(existing.concat(newIds)));
}
function addMessageToIntervention(ivId, type, text) {
  const iv = getIntervention(ivId);
  if (!iv) return;
  const now = new Date();
  iv.messages.push({
    id: Date.now(),
    type: type,
    text: text,
    display: now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }),
    timestamp: now.toISOString()
  });
  updateIntervention(iv);
}

/* ============================================================
   MODULE MESSAGE DE DEMANDE (messages suivants, moyens seuls)
   ============================================================ */
const DemandeSeule = (function () {
  let moyens = [];
  let ivId = null;
  let step = 0;
  let previouslyRequested = [];
  let saved = false;
  let editing = false;
  let editedMessage = null;

  function start(iv) {
    ivId = iv.id;
    moyens = iv.motif === "AVP" ? moyensTemplateAVP() : moyensTemplateACR();
    previouslyRequested = (iv.data && iv.data.moyensDemandes) || [];
    step = 0; saved = false; editing = false; editedMessage = null;
  }

  function generateMessage() {
    const checked = moyens.filter(m => m.checked).sort((a,b) => (a.priorite||0) - (b.priorite||0));
    if (checked.length === 0) return "Je demande...";
    const newOnes = checked.filter(m => !previouslyRequested.includes(m.id)).map(m => moyenLabelWithQty(m));
    const repeatOnes = checked.filter(m => previouslyRequested.includes(m.id)).map(m => moyenLabelWithQty(m));
    let msg = "";
    if (newOnes.length > 0) msg += "Je demande " + newOnes.join(", ") + ".";
    if (repeatOnes.length > 0) msg += (msg ? " " : "") + "Je redemande " + repeatOnes.join(", ") + ".";
    return msg + coordinationSuffix(moyens);
  }
  function currentMessage() { return editedMessage !== null ? editedMessage : generateMessage(); }

  function render(root) {
    root.innerHTML = "";
    renderHeader(root, true);
    root.appendChild(el("div", { class: "crumb", text: "Message de demande" }));

    if (step === 0) {
      root.appendChild(el("h1", { class: "page-title", text: "Moyens à engager" }));
      root.appendChild(precedentButton(() => goTo("intervention-detail")));
      const listWrap = el("div", {});

      root.appendChild(nav);
      return;
    }

    root.appendChild(el("h1", { class: "page-title", text: "Message généré" }));

    renderMessageEditor(root, {
      getText: currentMessage,
      isEditing: () => editing,
      setEditing: v => { editing = v; },
      setEdited: v => { editedMessage = v; },
      isEdited: () => editedMessage !== null,
      rerender: () => render(root)
    });

    const radioBtn = el("button", { class: "btn-primary", text: "Visualiser en grand", style: "width:100%; margin-bottom:8px" });
    radioBtn.addEventListener("click", () => showRadioView(currentMessage, "demande-seule"));
    root.appendChild(radioBtn);
    const saveBtn = el("button", { class: "btn-secondary", text: saved ? "Enregistré" : "Enregistrer", style: "width:100%" });
    saveBtn.addEventListener("click", () => {
      saved = true;
      addMessageToIntervention(ivId, (getIntervention(ivId).motif || "") + " — demande", currentMessage());
      const checkedIds = moyens.filter(m => m.checked).map(m => m.id);
      saveIvData(ivId, { moyensDemandes: unionMoyensDemandes(ivId, checkedIds) });
      render(root);
    });
    root.appendChild(saveBtn);
    if (saved) {
      renderMiniHistory(root, ivId);
      root.appendChild(el("h2", { class: "section-title", text: "Suite" }));
      const db = el("button", { class: "card", text: "Nouvelle demande" });
      db.addEventListener("click", () => { start(getIntervention(ivId)); render(root); });
      root.appendChild(db);
      const rb = el("button", { class: "card", text: "Message de renseignement" });
      rb.addEventListener("click", () => { Renseignement.start(getIntervention(ivId)); goTo("renseignement"); });
      root.appendChild(rb);
      const cb = el("button", { class: "btn-ghost", text: "Clôturer l'intervention" });
      cb.addEventListener("click", () => { const iv = getIntervention(ivId); if (iv) { iv.status = "cloturee"; updateIntervention(iv); } goTo("home"); });
      root.appendChild(cb);
    }
  }

  return { start, render };
})();

/* ============================================================
   MODULE ACR

const ACR = (function () {
  let state, step, cloture, ivId;

  function reset(interventionId) {
    ivId = interventionId;
    state = {
      contexte: null, chuteMetres: "", demande: null,
      moyens: moyensTemplateACR(),
      adresse: "", commune: "", paris: false,
      typeLieu: null, rdc: false, etageNum: "",
      victimes: [ { sexe: null, statut: "aucun", service: null } ],
      eqType: null, hopital: "", eqChoix: null,
      saved: false, editing: false, editedMessage: null,
      clEqChoix: null, clEqHeure: "", clIssue: null, clSaved: false, clEditing: false, clEditedMessage: null
    };
    step = 0; cloture = false;
  }
  reset(null);

  const contextes = [
    { id: "simple", label: "ACR simple", moyens: [] },
    { id: "pendaison", label: "Suite à pendaison", moyens: ["eps","police"] },
    { id: "chute", label: "Chute / hauteur", moyens: ["eps"] },
    { id: "noyade", label: "Suite à noyade", moyens: ["eps"] },
    { id: "rixe", label: "Suite à rixe", moyens: ["eps","police"] }
  ];

  function contexteSuffix() {
    switch (state.contexte) {
      case "pendaison": return "consécutif à une pendaison";
      case "chute": return state.chuteMetres ? ("consécutif à une chute de " + state.chuteMetres + " mètres environ") : "consécutif à une chute avec notion de hauteur";
      case "noyade": return "consécutif à une noyade";
      case "rixe": return "suite à une rixe";
      default: return "";
    }
  }
  function ordinalEtage(n) { n = parseInt(n, 10); if (isNaN(n)) return ""; return n === 1 ? "1er étage" : n + "e étage"; }

  function generateMessage() {
    const moyensLabels = state.moyens.filter(m => m.checked).map(m => moyenLabelWithQty(m));
    let demandePart = "";
    if (state.demande === true && moyensLabels.length > 0) demandePart = "Je demande " + moyensLabels.join(", ") + ", ";

    let lieuPart = state.adresse || "[adresse]";
    if (!state.paris && state.commune) lieuPart += " à " + state.commune;
    if (state.typeLieu === "vp") lieuPart += ", voie publique";
    else if (state.typeLieu === "lp") {
      if (state.rdc) lieuPart += ", rez-de-chaussée";
      else if (state.etageNum) lieuPart += ", " + ordinalEtage(state.etageNum);
    }

    const suffix = contexteSuffix() ? " " + contexteSuffix() : "";
    let victimePart;
    if (state.victimes.length === 1) {
      victimePart = "secours à " + victimeNoun(state.victimes[0]) + " en arrêt cardio-respiratoire" + suffix + ".";
    } else {
      const specials = state.victimes.filter(v => v.statut !== "aucun").map(v => victimeNoun(v));
      const dontTxt = specials.length > 0 ? ", dont " + specials.join(", ") : "";
      victimePart = "secours à " + state.victimes.length + " victimes en arrêt cardio-respiratoire" + suffix + dontTxt + ".";
    }

    let eqPart = "";
    if (state.eqType === "civ") {
      eqPart = state.eqChoix === "presente" ? " Équipe médicale " + (state.hopital || "[hôpital]") + " présente avant notre arrivée." : state.eqChoix === "attente" ? " Attendons équipe médicale." : "";
    } else if (state.eqType === "ar" && state.eqChoix === "attente") {
      eqPart = " Attendons équipe médicale.";
    }
    return demandePart + lieuPart + ", " + victimePart + eqPart + coordinationSuffix(state.moyens);
  }
  function currentMessage() { return state.editedMessage !== null ? state.editedMessage : generateMessage(); }

  function generateClotureMessage() {
    let eqPart = "";
    if (state.eqType === "civ" && state.clEqChoix) {
      eqPart = state.clEqChoix === "presente"
        ? "Équipe médicale " + (state.hopital || "[hôpital]") + " présentée" + (state.clEqHeure ? " à " + state.clEqHeure : "") + ". "
        : "Équipe médicale " + (state.hopital || "[hôpital]") + " se présente. ";
    }
    if (state.clIssue === "ua") {
      const mode = state.eqType === "civ" ? " " + (state.hopital || "[hôpital]") : "";
      const heureTxt = state.eqType === "civ" && state.clEqHeure && state.clEqChoix === "presente" ? " présentée à " + state.clEqHeure : "";
      return eqPart + "Victime urgence absolue évacuée par équipe médicale" + mode + heureTxt + ".";
    } else if (state.clIssue === "dcd") {
      return "Victime décédée laissée à disposition de la police.";
    }
    return eqPart;
  }
  function currentClotureMessage() { return state.clEditedMessage !== null ? state.clEditedMessage : generateClotureMessage(); }

  function totalSteps() { return 5; }

  function navButtons(container, canNext) {
    const nav = el("div", { class: "nav-buttons" });
    if (step < totalSteps()) {
      const next = el("button", { class: "btn-primary", text: step === totalSteps() - 1 ? "Générer le message" : "Suivant" });
      next.disabled = !canNext;
      next.addEventListener("click", () => { if (canNext) { step++; render(document.getElementById("app-root")); } });
      nav.appendChild(next);
    }
    container.appendChild(nav);
  }

  function renderVictimeBlock(container, index) {

    const wrap = el("div", { class: "victime-block" });

      hdr.appendChild(el("button", { class: "remove-link", text: "Retirer", onclick: () => { state.victimes.splice(index, 1); state.editedMessage = null; render(document.getElementById("app-root")); } }));

    ["homme","femme"].forEach(s => {
      const b = el("button", { class: "card card-half" + (v.sexe === s ? " active" : ""), text: s[0].toUpperCase() + s.slice(1) });
      b.addEventListener("click", () => { v.sexe = s; state.editedMessage = null; render(document.getElementById("app-root")); });
      sexeGrid.appendChild(b);
    });
    wrap.appendChild(sexeGrid);
    wrap.appendChild(el("div", { class: "note", style: "margin-top:0", text: "Statut particulier" }));
    const statuts = [
      {id:"aucun",label:"Aucun"},{id:"enfant",label:"Enfant"},{id:"nourrisson",label:"Nourrisson"},

    const statutGrid = el("div", { class: "grid-2", style: "margin-bottom:8px" });

      statutGrid.appendChild(b);

    wrap.appendChild(statutGrid);
    if (["militaireCorps","militaire","policier"].includes(v.statut)) {

      const svcO = el("button", { class: "card card-half" + (v.service === true ? " active" : ""), text: "En position de service" });
      svcO.addEventListener("click", () => { v.service = true; state.editedMessage = null; render(document.getElementById("app-root")); });
      const svcN = el("button", { class: "card card-half" + (v.service === false ? " active" : ""), text: "En position de repos" });
      svcN.addEventListener("click", () => { v.service = false; state.editedMessage = null; render(document.getElementById("app-root")); });
      svcGrid.appendChild(svcO); svcGrid.appendChild(svcN);
      wrap.appendChild(svcGrid);
    }
    container.appendChild(wrap);
  }

  function render(root) {
    root.innerHTML = "";
    renderHeader(root, true);

    if (cloture) return renderCloture(root);

    renderStepCrumb(root, "SAV › ACR", crumbs, step, i => { step = i; render(root); });

        b.addEventListener("click", () => {
          state.contexte = c.id;
          state.moyens.forEach(m => m.checked = c.moyens.includes(m.id));

          else render(root);

        root.appendChild(b);
      });
      if (state.contexte === "chute") {
        const wrap = el("div", {});
        wrap.appendChild(el("label", { class: "field-label", text: "Hauteur de la chute (mètres)" }));

        input.value = state.chuteMetres;
        input.addEventListener("input", e => { state.chuteMetres = e.target.value.replace(/[^0-9]/g, ""); e.target.value = state.chuteMetres; state.editedMessage = null; });
        input.addEventListener("blur", () => { if (state.chuteMetres) { step++; render(root); } });

        setTimeout(() => input.focus(), 0);
      }

    else if (step === 1) {

      const toggle = el("div", { class: "row", style: "margin-bottom:16px" });

      oui.addEventListener("click", () => { state.demande = true; state.editedMessage = null; render(root); });
      const non = el("button", { class: "card card-half" + (state.demande === false ? " active" : ""), text: "Non" });
      non.addEventListener("click", () => { state.demande = false; state.editedMessage = null; render(root); });
      toggle.appendChild(oui); toggle.appendChild(non);
      root.appendChild(toggle);
      if (state.demande === true) {

    else if (step === 2) {

      vp.addEventListener("click", () => { state.typeLieu = "vp"; state.editedMessage = null; const bv = state.moyens.find(x => x.id === "brisevue"); if (bv) { bv.checked = true; if (!bv.qty) bv.qty = 1; state.demande = true; } render(root); });

      isEditing: () => state.clEditing,
      setEditing: v => { state.clEditing = v; },
      setEdited: v => { state.clEditedMessage = v; },
      isEdited: () => state.clEditedMessage !== null,
      rerender: () => render(root)
    });

    const radioBtn = el("button", { class: "btn-primary", text: "Visualiser en grand", style: "width:100%; margin-bottom:8px" });
    radioBtn.addEventListener("click", () => showRadioView(() => currentClotureMessage() || "…", "acr"));
    root.appendChild(radioBtn);
    const saveBtn = el("button", { class: "btn-secondary", text: state.clSaved ? "Enregistré" : "Enregistrer la clôture", style: "width:100%; margin-bottom:8px" });
    saveBtn.addEventListener("click", () => { state.clSaved = true; addMessageToIntervention(ivId, "ACR — clôture", currentClotureMessage()); render(root); });
    root.appendChild(saveBtn);
    const back = el("button", { class: "btn-ghost", text: "Retour au message initial" });
    back.addEventListener("click", () => { cloture = false; render(root); });
    root.appendChild(back);
  }

  return { reset, render };
})();
